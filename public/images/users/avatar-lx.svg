<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="fundo" cx="50%" cy="38%" r="70%">
      <stop offset="0" stop-color="#18205a"/>
      <stop offset=".6" stop-color="#0d1330"/>
      <stop offset="1" stop-color="#060a1a"/>
    </radialGradient>
    <radialGradient id="nebT" cx="22%" cy="20%" r="55%">
      <stop offset="0" stop-color="#22c5e0" stop-opacity=".55"/>
      <stop offset="1" stop-color="#22c5e0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebP" cx="85%" cy="78%" r="60%">
      <stop offset="0" stop-color="#a855f7" stop-opacity=".55"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebG" cx="80%" cy="15%" r="40%">
      <stop offset="0" stop-color="#34d37a" stop-opacity=".35"/>
      <stop offset="1" stop-color="#34d37a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pessoa" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7ce8f5"/>
      <stop offset=".5" stop-color="#22c5e0"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="brilho" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="circ"><circle cx="64" cy="64" r="64"/></clipPath>
  </defs>

  <g clip-path="url(#circ)">
    <!-- fundo com nebulosa -->
    <rect width="128" height="128" fill="url(#fundo)"/>
    <rect width="128" height="128" fill="url(#nebT)"/>
    <rect width="128" height="128" fill="url(#nebP)"/>
    <rect width="128" height="128" fill="url(#nebG)"/>
    <!-- grade sutil -->
    <g stroke="#ffffff" stroke-opacity=".05" stroke-width="1">
      <path d="M0 32H128M0 64H128M0 96H128M32 0V128M64 0V128M96 0V128"/>
    </g>
    <!-- estrelas -->
    <g fill="#ffffff">
      <circle cx="22" cy="44" r="1" opacity=".7"/>
      <circle cx="104" cy="36" r="1.2" opacity=".8"/>
      <circle cx="96" cy="58" r=".8" opacity=".5"/>
      <circle cx="30" cy="20" r=".8" opacity=".55"/>
      <circle cx="16" cy="70" r=".7" opacity=".45"/>
    </g>

    <!-- pessoa -->
    <g filter="url(#glow)">
      <circle cx="64" cy="50" r="19" fill="url(#pessoa)"/>
      <path d="M22 128c0-25 18.8-42 42-42s42 17 42 42z" fill="url(#pessoa)"/>
    </g>
    <circle cx="64" cy="50" r="19" fill="url(#brilho)" opacity=".6"/>
    <path d="M30 128c2-19 16-32 34-32" fill="none" stroke="#ffffff" stroke-opacity=".35" stroke-width="2" stroke-linecap="round"/>

    <!-- faísca solar -->
    <g transform="translate(92 22)">
      <circle r="5" fill="#ffa12e" opacity=".25"/>
      <circle r="2.6" fill="#ffd27a"/>
      <g stroke="#ffd27a" stroke-width="1.3" stroke-linecap="round">
        <path d="M0-8V-5M0 5V8M-8 0H-5M5 0H8"/>
      </g>
    </g>
  </g>
</svg>
